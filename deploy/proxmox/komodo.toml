# Pile Komodo de komodoprox : copie de référence. À coller dans un Resource Sync défini dans
# l'interface, ou à reporter champ par champ dans une nouvelle pile.
# Préalable : le secret WOW_ALTBOARD_DB_PASSWORD (Settings > Variables, case « secret »).

[[stack]]
name = "wow-altboard"
description = "Tableau de bord WoW AltBoard et API de synchronisation — https://wow.ekreativ.be"

[stack.config]
server = "komodoprox"
git_account = "wnx82"
repo = "wnx82/wow-altboard"
branch = "main"
run_directory = "deploy/proxmox"
file_paths = ["compose.yaml"]
# « migrate » s'arrête après avoir appliqué les migrations : ce n'est pas une panne.
ignore_services = ["migrate"]
# WOW_STATUS_* : adresses de la bêta, relevées le 2026-10-09 (docs/SERVER-STATUS.md).
environment = """
WOW_DB_PASSWORD = [[WOW_ALTBOARD_DB_PASSWORD]]
WOW_APP_ORIGIN = https://wow.ekreativ.be
WOW_BIND_IP = 10.0.0.15
WOW_STATUS_AUTH_TARGETS = test.actual.battle.net:1119
WOW_STATUS_GAME_TARGETS = 24.105.52.77:3724,24.105.52.94:3724,66.40.178.65:3724,66.40.179.219:3724
"""

# Alerte d'échec : chaque tentative de déploiement en échec (ActionFailed) part sur ntfy.sh.
# Le topic fait office de mot de passe : il est dans Vaultwarden (« ntfy — alertes Komodo
# komodoprox »), jamais dans le dépôt.
[[alerter]]
name = "ntfy"

[alerter.config]
enabled = true
endpoint.type = "Ntfy"
endpoint.params.url = "https://ntfy.sh/<topic Vaultwarden>"
alert_types = ["ActionFailed"]

# Déploiement automatique : pousser sur la branche suffit. L'action interroge le dépôt au lieu
# d'attendre un webhook, Komodo n'étant pas joignable depuis GitHub (Cloudflare Access).
# Préalable : la variable WOW_ALTBOARD_AUTO_DEPLOY_ATTEMPTED (Settings > Variables), vide.
[[action]]
name = "wow-altboard-auto-deploy"
description = "Déploie la pile wow-altboard quand sa branche a avancé."

[action.config]
schedule_format = "English"
schedule = "Every 5 minutes"
schedule_enabled = true
# Une alerte par passage n'apprendrait rien ; un échec, si.
schedule_alert = false
failure_alert = true
file_contents = """
const STACK = "wow-altboard";
// Dernier commit tenté et nombre de tentatives, « <commit>:<n> ». Un échec passager (Docker Hub
// injoignable pendant la construction, le 2026-10-13) est retenté au passage suivant ; au-delà de
// MAX_ATTEMPTS, un commit qui ne se déploie pas n'est plus rejoué toutes les cinq minutes.
const ATTEMPTED = "WOW_ALTBOARD_AUTO_DEPLOY_ATTEMPTED";
const MAX_ATTEMPTS = 3;

await komodo.write("RefreshStackCache", { stack: STACK });
const { info } = await komodo.read("GetStack", { stack: STACK });
const latest = info?.latest_hash;
const deployed = info?.deployed_hash;
const [attemptedHash, attemptedCount] = ((await komodo.read("GetVariable", { name: ATTEMPTED })).value ?? "").split(":");
// Valeur sans compteur (format précédent) : une tentative.
const attempts = latest && attemptedHash === latest ? Number(attemptedCount) || 1 : 0;

if (!latest) {
  console.log("Dernier commit inconnu (dépôt injoignable ?) : rien n'est fait.");
} else if (latest === deployed) {
  console.log(`À jour : ${latest}`);
} else if (attempts >= MAX_ATTEMPTS) {
  console.log(`${latest} : ${attempts} tentatives sans succès. Pousser un correctif, ou lancer Deploy à la main.`);
} else {
  const attempt = attempts + 1;
  console.log(`Déploiement de ${latest}, tentative ${attempt} sur ${MAX_ATTEMPTS} (en place : ${deployed ?? "rien"})`);
  await komodo.write("UpdateVariableValue", { name: ATTEMPTED, value: `${latest}:${attempt}` });
  const update = await komodo.execute_and_poll("DeployStack", { stack: STACK });
  if (!("success" in update) || !update.success) {
    throw new Error(`Le déploiement de ${latest} a échoué (tentative ${attempt} sur ${MAX_ATTEMPTS}) : voir la dernière mise à jour de la pile.`);
  }
  console.log(`Déployé : ${latest}`);
}
"""
