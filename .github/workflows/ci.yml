# Contrôles lancés à chaque push et à chaque pull request : ceux que README et docs/AGENT.md
# demandent de lancer à la main avant un commit.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Version de l'image de production (web/Dockerfile).
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Le PostgreSQL du développement : db/dev-init y crée la base de test.
      - name: PostgreSQL
        working-directory: .
        run: docker compose -f docker-compose.dev.yml up -d --wait
      # Le fichier d'exemple ne porte que les identifiants de développement.
      - name: Configuration
        run: cp .env.example .env.local
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # La production reconstruit cette image à chaque déploiement : un Dockerfile cassé doit échouer
  # ici, pas sur le serveur.
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Avec le dépôt en contexte nommé, comme deploy/proxmox/compose.yaml.
      - run: docker build --build-context repo=. --tag wow-altboard-web:ci web

  # Ce qui s'installe sur les serveurs hors de la pile : script de sauvegarde et règles d'alerte.
  ops:
    name: Exploitation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/proxmox/backup/*.sh
      # Version de Prometheus du conteneur « observability ».
      - name: Règles d'alerte
        run: >-
          docker run --rm --volume "$PWD/deploy/proxmox/monitoring/rules:/rules:ro" --entrypoint promtool
          prom/prometheus:v3.7.3 test rules /rules/tests/wow-altboard.test.yml

  agent:
    name: Agent
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - name: Publication
        run: dotnet publish src/AltBoardSync -c Release -o ../dist
      # L'exécutable publié (réduit, en un seul fichier) démarre, lit un dossier du jeu et construit son
      # document : un défaut de réduction n'apparaît qu'ici (0.7.0), pas dans dotnet test. selfcheck est
      # aussi ce que la mise à jour automatique exige d'une version avant de l'installer.
      - name: Exécutable publié
        env:
          ALTBOARDSYNC_HOME: ${{ runner.temp }}\altboardsync
        run: |
          $exe = Resolve-Path ../dist/AltBoardSync.exe
          $wow = Join-Path $env:RUNNER_TEMP 'wow'
          $account = Join-Path $wow '_classic_\WTF\Account\123456789#1\SavedVariables'
          New-Item -ItemType Directory -Force $account | Out-Null
          Copy-Item ../tests/fixtures/account-two-characters.lua (Join-Path $account 'AltBoard.lua')
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $reported = & $exe version
          if ($LASTEXITCODE -ne 0 -or $reported -ne $version) { throw "version : « $reported » au lieu de $version" }
          & $exe config set wowPath $wow
          if ($LASTEXITCODE -ne 0) { throw 'config set wowPath' }
          & $exe scan
          if ($LASTEXITCODE -ne 0) { throw 'scan' }
          $check = & $exe selfcheck
          $check
          if ($LASTEXITCODE -ne 0 -or $check[0] -ne $version) { throw 'selfcheck' }
          if (-not ($check -match '^comptes : 1 lus')) { throw 'selfcheck : compte non lu' }
      - uses: actions/upload-artifact@v7
        with:
          name: AltBoardSync
          path: dist/AltBoardSync.exe
          if-no-files-found: error
          retention-days: 14
